name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Zip Lambda code
      run: zip -r lambda-function.zip index.js package.json package-lock.json node_modules/

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Deploy CloudFormation stack
      run: aws cloudformation deploy --template-file template.yml --stack-name mongodb-client-lambda-stack --capabilities CAPABILITY_IAM

    - name: Deploy to AWS Lambda
      run: aws lambda update-function-code --function-name MongoDBClientQueryHelper --zip-file fileb://lambda-function.zip